server {
    listen 8086;
    listen [::]:8086;
    server_name SERVER_IP;
    root /var/www/devops-hackathon-de008-daoxuankhanh-cntt4/devops-hackathon-de008-daoxuankhanh-cntt4/src;
    index index.html;
    access_log /var/log/nginx/daoxuankhanh-cntt4.access.log;
    error_log /var/log/nginx/daoxuankhanh-cntt4.error.log;
    location / {
        allow all;
        try_files $uri $uri/ =404;
    }
}